<!DOCTYPE html>
<!-- The Ear Trainer's smart link: sends a phone to its store. The logic and the store addresses are in ../get/get.js. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Get Pawry: Ear Trainer</title>
<meta property="og:title" content="Pawry: Ear Trainer">
<meta property="og:description" content="Learn to play by ear. Hear where every note belongs, a few minutes a day.">
<style>
:root { --bg:#ffffff; --fg:#1d1d1f; --muted:#6e6e73; --accent:#e8590c; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#111113; --fg:#f2f2f4; --muted:#9a9aa0; --accent:#ff8a3d; }
}
* { box-sizing: border-box; }
body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg);
  font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased; }
main { width:100%; max-width: 26rem; padding: 2rem 1.25rem; text-align:center; }
h1 { font-size: 1.7rem; line-height:1.25; margin: 0 0 .5rem; }
p { margin: .6rem 0; color: var(--muted); }
a { color: var(--accent); text-decoration: none; }
.btn { display:block; margin-top:1.2rem; padding:.95rem 1rem; border-radius:14px; background:var(--accent);
  color:#fff; font-weight:700; font-size:1.1rem; }
</style>
</head>
<body>
<main id="get"><noscript><p><a href="../">Pawry: Ear Trainer</a></p></noscript></main>
<script src="../get/get.js"></script>
</body>
</html>
